<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario Litúrgico y de Fe</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="calendar-container">
    <h1>Calendario Litúrgico y de Fe</h1>

    <div class="calendar-header">
      <button id="prevMonth">‹</button>
      <h2 id="monthYear"></h2>
      <button id="nextMonth">›</button>
    </div>

    <div class="weekdays">
      <div>Lun</div>
      <div>Mar</div>
      <div>Mié</div>
      <div>Jue</div>
      <div>Vie</div>
      <div>Sáb</div>
      <div>Dom</div>
    </div>

    <div id="calendar"></div>
  </div>

  <script src="calendar.js"></script>

</body>
</html>
